# Deployment manifest for Vercel only. Local development uses backend/pyproject.toml.
# Keep these pins in sync with backend/uv.lock.
[project]
name = "skillbridge-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

# Serve the built React app from the CDN even though the app has an /api middleware.
[tool.vercel.fastapi.static]
cdn = true
